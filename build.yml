name: build-kernel

on:
  workflow_dispatch:
    inputs:
      config:
        description: Path to the config yml
        default: config.yml

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: sudo apt-get update && sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev libncurses-dev dwarves cpio xz-utils
      - run: python3 build.py "$CONFIG"
        env:
          CONFIG: ${{ inputs.config }}
      - uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: out/
